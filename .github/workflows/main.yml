name: Probar ZiroxOS en Vivo

on:
  workflow_dispatch:

jobs:
  probar-live:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar QEMU, OVMF, noVNC y Cloudflared
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://cloudflare.com | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://cloudflare.com any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf novnc websockify cloudflared
          sudo chmod 666 /dev/kvm

      - name: Descargar ISO de ZiroxOS
        run: wget -q -O ziroxos.iso "https://github.com/zirox-os/zirox-os.github.io/releases/download/v0.1/zirox-os-2026.11.26-x86_64.iso"

      - name: Iniciar ZiroxOS con pantalla web (noVNC)
        run: |
          qemu-system-x86_64 \
            -enable-kvm \
            -m 4096 \
            -smp 2 \
            -bios /usr/share/ovmf/OVMF.fd \
            -cdrom ziroxos.iso \
            -vga virtio \
            -vnc :0 &

          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &

          cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          for i in {1..15}; do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "=== ABRE ESTE ENLACE EN TU NAVEGADOR ==="
              echo "$URL/vnc.html"
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            cat tunnel.log
          fi

          sleep 1800
